pipeline:
  name: python-docker-pipeline
  identifier: python_docker_pipeline
  description: Install, test, and verify the Python app, then build and push its Docker image to Docker Hub.
  projectIdentifier: project_proj_57c3
  orgIdentifier: default
  tags:
    ai_generated: ""
  properties:
    ci:
      codebase:
        connectorRef: connector_Github_7cc4
        repoName: reddyabhireddy7139-ai/harness
        build:
          type: branch
          spec:
            branch: main
  stages:
    - stage:
        name: build-python
        identifier: build_python
        description: Build, test, and push to Docker Hub
        type: CI
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: install_deps
                  spec:
                    command: |-
                      cd python-project
                      pip install -r requirements.txt
              - step:
                  type: Run
                  name: Run Tests
                  identifier: run_tests
                  spec:
                    command: |-
                      cd python-project
                      pip install -r requirements.txt
                      pytest test_app.py -v
              - step:
                  type: Run
                  name: Run App
                  identifier: run_app
                  spec:
                    command: |-
                      cd python-project
                      pip install -r requirements.txt
                      python -c "from app import app; client = app.test_client(); print(client.get('/').get_json()); print(client.get('/health').get_json())"
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push to Docker Hub
                  identifier: build_push_docker
                  spec:
                    connectorRef: connector_DockerRegistry_a608
                    repo: abhilashreddy7139/python-harness-app
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: python-project/Dockerfile
                    context: python-project
